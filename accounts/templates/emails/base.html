<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="format-detection" content="telephone=no,address=no,email=no,date=no,url=no">
  <title>{% block title %}NoLineMed{% endblock %}</title>
  <style>
    body,
    table,
    td,
    a {
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }

    table,
    td {
      mso-table-lspace: 0;
      mso-table-rspace: 0;
    }

    table {
      border-collapse: collapse !important;
    }

    body {
      width: 100% !important;
      min-width: 100%;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      background-color: #F6F9FB;
    }

    a {
      color: #0F766E;
    }

    @media only screen and (max-width: 620px) {
      .email-shell {
        width: 100% !important;
      }

      .content-padding {
        padding-right: 24px !important;
        padding-left: 24px !important;
      }

      .verification-code {
        font-size: 28px !important;
        letter-spacing: 5px !important;
      }
    }
  </style>
</head>
<body>
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;mso-hide:all;">
    {% block preheader %}A secure message from NoLineMed.{% endblock %}
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F6F9FB">
    <tr>
      <td align="center" style="padding:32px 12px;">
        <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
        <table class="email-shell" role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background-color:#FFFFFF;border:1px solid #D8E1E8;">
          <tr>
            <td class="content-padding" style="padding:24px 40px;background-color:#17324D;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td width="40" height="40" align="center" valign="middle" style="width:40px;height:40px;background-color:#0F766E;border-radius:20px;color:#FFFFFF;font-family:Arial,sans-serif;font-size:24px;line-height:40px;">
                    +
                  </td>
                  <td style="padding-left:12px;color:#FFFFFF;font-family:Inter,Arial,sans-serif;font-size:24px;font-weight:700;line-height:30px;">
                    NoLineMed
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td class="content-padding" style="padding:44px 40px 40px;color:#263442;font-family:Inter,Arial,sans-serif;font-size:16px;line-height:25px;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <tr>
            <td class="content-padding" style="padding:24px 40px;background-color:#17324D;color:#D8E1E8;font-family:Inter,Arial,sans-serif;font-size:12px;line-height:19px;">
              <p style="margin:0 0 8px;color:#FFFFFF;font-size:14px;font-weight:700;">NoLineMed</p>
              <p style="margin:0 0 12px;">Run your clinic with clarity.</p>
              <p style="margin:0;">
                Need help? <a href="mailto:{{ support_email|default:'support@nolinemed.app' }}" style="color:#5EEAD4;text-decoration:underline;">Contact support</a>
              </p>
              <p style="margin:12px 0 0;color:#94A3B8;">&copy; {% now "Y" %} NoLineMed. All rights reserved.</p>
            </td>
          </tr>
        </table>
        <!--[if mso]></td></tr></table><![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
